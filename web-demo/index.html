<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Trade Pipeline — Browser Demo</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e8eef2;background:#101c25;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;border-bottom:1px solid #344852}h1{margin:0 0 6px;font-size:24px}p,small{color:#aebfc8}button,input{font:inherit;padding:9px;border:1px solid #50626e;border-radius:8px;background:#20333e;color:inherit}button{cursor:pointer}button:hover{border-color:#b7ed66}button.primary{background:#b7ed66;color:#162319;font-weight:650}button:disabled{opacity:.45;cursor:not-allowed}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:16px 24px;align-items:center}.board{display:flex;gap:12px;overflow-x:auto;padding:0 24px 24px;min-height:50vh}.column{background:#142832;border:1px solid #3a4c58;border-radius:12px;min-width:235px;width:235px;padding:12px}.column h2{font-size:14px;margin:4px 0 14px}.case{display:block;width:100%;text-align:left;margin-bottom:10px;padding:12px;background:#243a47}.case strong,.case small{display:block;margin-bottom:6px}.notice{margin:0 24px 14px;font-size:13px;color:#aebfc8}.bad{color:#ffbc9e}.good{color:#b7ed66}dialog{width:min(680px,95vw);max-height:90vh;overflow:auto;border:1px solid #50626e;border-radius:14px;padding:20px;background:#142832;color:#e8eef2}dialog::backdrop{background:#000a}label{display:block;margin:8px 0}label input:not([type=checkbox]){display:block;width:100%;margin-top:5px}.task{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;border-bottom:1px solid #40535d}.task input[type=text]{min-width:100px;flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}#history{font-size:12px;color:#aebfc8;white-space:pre-wrap;overflow-wrap:anywhere}#error{color:#ffbc9e}#query{min-width:160px}.badge{font-size:12px}
</style></head><body>
<header><h1>Open Trade Pipeline</h1><small>Commercial and execution boards · independent local browser demo</small></header>
<div class="toolbar"><button id="commercial">Commercial</button><button id="operations">Execution</button><button class="primary" id="new">+ Synthetic case</button><input id="query" placeholder="Search demo cases" aria-label="Search demo cases"><button id="export">Export JSON</button><button id="reset">Reset demo</button></div>
<p class="notice">Use fictional information only. Records are stored in this browser, without encryption, authentication or a server. This demo does not sync with the Python CLI or the original private applications.</p>
<main id="board" class="board"></main>
<dialog id="editor"><h2 id="heading"></h2><p id="status"></p><label>Case label<input id="title"></label><label>Owner<input id="owner"></label><label>Follow-up date<input id="due" type="date"></label><div id="tasks"></div><p id="gate"></p><div id="requestInfo"></div><p id="error" role="alert"></p><div class="actions"><button id="save" class="primary">Save</button><button id="advance">Advance</button><button id="pay">Confirm payment</button><button id="handoff">Start execution</button><button id="request">Request missing info</button><button id="validate">Validate response</button><button id="lose">Close lost</button><button id="close">Cancel</button></div><h3>History</h3><div id="history"></div></dialog>
<script>
const createModel=function createModel(){
  const commercial=["New Inquiry","Diagnostic Started","Diagnostic Completed","Cost Estimate Started","Cost Estimate Sent","Proposal Accepted","Closed Won","Closed Lost"];
  const operations=["Intake","Technical Review","Cost and Planning","Documentation","Shipment and Transit","Arrival and Clearance","Delivery","Post Operation"];
  const steps={commercial:{
    "New Inquiry":["Confirm inquiry","Assign follow-up"],
    "Diagnostic Started":["Review scope","Record missing information"],
    "Diagnostic Completed":["Confirm diagnostic"],
    "Cost Estimate Started":["Prepare estimate","Review estimate"],
    "Cost Estimate Sent":["Confirm receipt","Review feedback"],
    "Proposal Accepted":["Confirm engagement","Prepare handoff"],
    "Closed Won":[],"Closed Lost":[]},
    operations:{"Intake":["Confirm scope","Validate input"],"Technical Review":["Review technical information","Resolve requirements"],"Cost and Planning":["Review cost inputs","Confirm plan"],"Documentation":["Review documents","Resolve blockers"],"Shipment and Transit":["Confirm shipment milestone"],"Arrival and Clearance":["Confirm arrival","Review release milestone"],"Delivery":["Confirm delivery"],"Post Operation":["Review closeout"]}};
  function requireText(v){if(typeof v!=="string"||!v.trim())throw Error("A value is required.");return v.trim()}
  function tasks(mode,stage){return steps[mode][stage].map(title=>({title,done:false,owner:""}))}
  function event(c,message){c.history.push({at:new Date().toISOString(),message})}
  function make(id,title,owner,due=""){return {id:requireText(id),title:requireText(title),owner:requireText(owner),due,mode:"commercial",stage:commercial[0],payment:false,tasks:tasks("commercial",commercial[0]),history:[],returnTo:null,request:"",validated:false}}
  function blockers(c){let b=c.tasks.filter(t=>!t.done).map(t=>t.title);if(c.mode==="commercial"&&c.stage==="Diagnostic Completed"&&!c.payment)b.push("Confirm payment");if(c.returnTo&&!c.validated)b.push("Validate requested information");return b}
  function advance(c){const phases=c.mode==="commercial"?commercial:operations;if(c.stage==="Closed Won"||c.stage==="Closed Lost"||c.stage==="Post Operation")throw Error("No further stage.");const b=blockers(c);if(b.length)throw Error("Outstanding: "+b.join(", "));if(c.returnTo){const prior=c.returnTo;c.stage=prior.stage;c.tasks=prior.tasks;c.returnTo=null;c.request="";c.validated=false;event(c,"Returned to "+c.stage);return}const i=phases.indexOf(c.stage);if(i<0)throw Error("Invalid stage");const old=c.stage;c.stage=phases[i+1];c.tasks=tasks(c.mode,c.stage);event(c,old+" → "+c.stage)}
  function payment(c){if(c.mode!=="commercial"||["Closed Won","Closed Lost"].includes(c.stage))throw Error("Payment can only be recorded during an active commercial case.");if(!c.payment){c.payment=true;event(c,"Operator confirmed payment (not independently verified)")}}
  function lose(c,reason){if(c.mode!=="commercial"||["Closed Won","Closed Lost"].includes(c.stage))throw Error("Only an active commercial case can close lost.");event(c,"Closed lost: "+requireText(reason));c.stage="Closed Lost";c.tasks=[]}
  function handoff(c){if(c.mode!=="commercial"||c.stage!=="Closed Won")throw Error("Handoff requires Closed Won.");c.mode="operations";c.stage=operations[0];c.tasks=tasks(c.mode,c.stage);event(c,"Execution handoff")}
  function request(c,message){if(c.mode!=="operations"||c.stage==="Intake"||c.stage==="Post Operation"||c.returnTo)throw Error("Request requires an active execution phase outside Intake.");c.request=requireText(message);c.returnTo={stage:c.stage,tasks:c.tasks};c.stage="Intake";c.tasks=[{title:"Review response",done:false,owner:""}];c.validated=false;event(c,"Requested missing information")}
  return {commercial,operations,make,blockers,advance,payment,lose,handoff,request};
};
const M=createModel(),key="open-trade-pipeline-browser-demo-v1",$=id=>document.getElementById(id);
let state=[],mode="commercial",draft=null;
try{const parsed=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(parsed))state=parsed}catch{}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function persist(){localStorage.setItem(key,JSON.stringify(state));render()}
function render(){const q=$("query").value.toLowerCase();$("board").replaceChildren();const phases=mode==="commercial"?M.commercial:M.operations;for(const phase of phases){const col=node("section",undefined,"column");const rows=state.filter(c=>c.mode===mode&&c.stage===phase&&[c.title,c.owner].some(v=>String(v).toLowerCase().includes(q)));col.append(node("h2",phase+" · "+rows.length));for(const c of rows){const el=node("button",undefined,"case");el.append(node("strong",c.title),node("small",c.owner||"Unassigned"),node("small",c.tasks.filter(t=>t.done).length+"/"+c.tasks.length+" tasks"),node("span",M.blockers(c).length?"Blocked":"Ready","badge "+(M.blockers(c).length?"bad":"good")));if(c.due&&c.due<new Date().toISOString().slice(0,10))el.append(node("small","Follow-up overdue","bad"));el.onclick=()=>open(c);col.append(el)}$("board").append(col)}}
function refresh(){if(!draft)return;$("heading").textContent=draft.title;$("status").textContent=draft.mode+" / "+draft.stage;$("title").value=draft.title;$("owner").value=draft.owner;$("due").value=draft.due||"";$("tasks").replaceChildren();draft.tasks.forEach((t,i)=>{const row=node("div",undefined,"task"),cb=node("input");cb.type="checkbox";cb.checked=t.done;cb.setAttribute("aria-label",t.title);cb.onchange=()=>{draft.tasks[i].done=cb.checked;showGate()};const owner=node("input");owner.type="text";owner.placeholder="Task owner";owner.value=t.owner;owner.setAttribute("aria-label","Owner: "+t.title);owner.oninput=()=>{draft.tasks[i].owner=owner.value};row.append(cb,node("span",t.title),owner);$("tasks").append(row)});$("history").textContent=draft.history.map(e=>e.at+" — "+e.message).join("\n");$("requestInfo").textContent=draft.returnTo?"Pending request: "+draft.request+" · Return to "+draft.returnTo.stage:"";const active=draft.mode==="commercial"&&!["Closed Won","Closed Lost"].includes(draft.stage);$("pay").hidden=!active||draft.payment;$("lose").hidden=!active;$("handoff").hidden=draft.mode!=="commercial"||draft.stage!=="Closed Won";$("request").hidden=draft.mode!=="operations"||["Intake","Post Operation"].includes(draft.stage)||!!draft.returnTo;$("validate").hidden=!draft.returnTo||draft.validated;$("advance").hidden=["Closed Won","Closed Lost","Post Operation"].includes(draft.stage);showGate()}
function showGate(){const b=M.blockers(draft);$("gate").textContent=b.length?"Outstanding: "+b.join(" · "):"No outstanding requirements";$("gate").className=b.length?"bad":"good"}
function open(c){draft=structuredClone(c);$("error").textContent="";refresh();$("editor").showModal()}
function collect(){const title=$("title").value.trim(),owner=$("owner").value.trim();if(!title||!owner)throw Error("Case label and owner are required.");draft.title=title;draft.owner=owner;draft.due=$("due").value}
function commit(){const i=state.findIndex(c=>c.id===draft.id);if(i<0)state.push(structuredClone(draft));else state[i]=structuredClone(draft);persist()}
function act(fn){try{collect();fn();commit();mode=draft.mode;render();refresh();$("error").textContent=""}catch(e){$("error").textContent=e.message}}
$("commercial").onclick=()=>{mode="commercial";render()};$("operations").onclick=()=>{mode="operations";render()};$("query").oninput=render;
$("new").onclick=()=>open(M.make("demo-"+Date.now()+"-"+Math.random().toString(36).slice(2),"Synthetic case","Demo operator"));
$("save").onclick=()=>act(()=>{$("editor").close()});$("close").onclick=()=>$("editor").close();$("advance").onclick=()=>act(()=>M.advance(draft));$("pay").onclick=()=>act(()=>M.payment(draft));$("handoff").onclick=()=>act(()=>M.handoff(draft));$("lose").onclick=()=>{const reason=prompt("Synthetic reason for closing lost");if(reason)act(()=>M.lose(draft,reason))};$("request").onclick=()=>{const message=prompt("Fictional missing information");if(message)act(()=>M.request(draft,message))};$("validate").onclick=()=>act(()=>{draft.validated=true;draft.history.push({at:new Date().toISOString(),message:"Response validated by operator"})});
$("export").onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({app:"open-trade-pipeline-browser-demo",version:1,cases:state},null,2)],{type:"application/json"}));const a=node("a");a.href=url;a.download="synthetic-trade-demo.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$("reset").onclick=()=>{if(confirm("Delete all local demo records?")){state=[];persist()}};render();
</script></body></html>
